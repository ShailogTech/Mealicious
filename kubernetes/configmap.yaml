apiVersion: v1
kind: ConfigMap
metadata:
  name: mealicious-config
  namespace: mealicious
  labels:
    app: mealicious
data:
  postgres-user: "mealicious"
  postgres-db: "mealicious"
  cashfree-env: "sandbox"
  cashfree-app-id: "TEST11081858eb7074bf1d5c5b1b0b8e85818011"
  # Must match the URL the browser actually uses, or NextAuth callbacks break.
  # This is the ingress host from ingress.yaml. If you reach the app via
  # `kubectl port-forward` instead, override this to http://localhost:3000.
  nextauth-url: "http://mealicious.local"
  admin-emails: "admin@mealicious.com"
